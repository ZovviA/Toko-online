<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tambah Produk - TokoKu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div class="max-w-4xl mx-auto p-6">
      <!-- Header Halaman -->
      <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Tambah Produk</h1>
        <p class="text-gray-500 mt-1">Tambahkan produk baru ke dalam TokoKu.</p>
      </div>

      <!-- Form Tambah Produk -->
      <div class="bg-white rounded-xl shadow p-6">
        <form id="form-tambah-produk">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <!-- Nama Produk -->
            <div class="md:col-span-2">
              <label
                for="nama-produk"
                class="block text-sm font-medium text-gray-700 mb-2"
              >
                Nama Produk
              </label>
              <input
                type="text"
                id="nama-produk"
                name="nama_produk"
                placeholder="Contoh: Mouse Wireless"
                class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-yellow-400"
                required
              />
            </div>

            <!-- Kategori -->
            <div>
              <label
                for="kategori-produk"
                class="block text-sm font-medium text-gray-700 mb-2"
              >
                Kategori
              </label>
              <select
                id="kategori-produk"
                name="id_kategori"
                class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-yellow-400"
                required
              >
                <option value="">-- Pilih Kategori --</option>
              </select>
            </div>

            <!-- Harga -->
            <div>
              <label
                for="harga-produk"
                class="block text-sm font-medium text-gray-700 mb-2"
              >
                Harga (Rp)
              </label>
              <input
                type="number"
                id="harga-produk"
                name="harga"
                min="0"
                placeholder="Contoh: 150000"
                class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-yellow-400"
                required
              />
            </div>

            <!-- Stok -->
            <div>
              <label
                for="stok-produk"
                class="block text-sm font-medium text-gray-700 mb-2"
              >
                Stok
              </label>
              <input
                type="number"
                id="stok-produk"
                name="stok"
                min="0"
                placeholder="Contoh: 10"
                class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-yellow-400"
                required
              />
            </div>

            <!-- URL Gambar -->
            <div>
              <label
                for="gambar-produk"
                class="block text-sm font-medium text-gray-700 mb-2"
              >
                URL Gambar
              </label>
              <input
                type="url"
                id="gambar-produk"
                name="gambar"
                placeholder="https://contoh.com/gambar.jpg"
                class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-yellow-400"
                required
              />
            </div>

            <!-- Rating -->
            <div>
              <label
                for="rating-produk"
                class="block text-sm font-medium text-gray-700 mb-2"
              >
                Rating
              </label>
              <input
                type="number"
                id="rating-produk"
                name="rating"
                min="0"
                max="5"
                step="0.1"
                placeholder="Contoh: 4.5"
                class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-yellow-400"
                required
              />
            </div>

            <!-- Deskripsi Produk -->
            <div class="md:col-span-2">
              <label
                for="deskripsi-produk"
                class="block text-sm font-medium text-gray-700 mb-2"
              >
                Deskripsi Produk
              </label>
              <textarea
                id="deskripsi-produk"
                name="deskripsi"
                rows="4"
                placeholder="Jelaskan detail produk..."
                class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-yellow-400"
                required
              ></textarea>
            </div>
          </div>

          <!-- Tombol Aksi -->
          <div class="flex justify-end gap-3 mt-8 pt-5 border-t">
            <a
              href="produk-admin.html"
              class="px-5 py-2.5 rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300 transition"
            >
              Batal
            </a>
            <button
              type="submit"
              class="px-5 py-2.5 rounded-lg bg-yellow-500 text-white font-semibold hover:bg-yellow-600 transition"
            >
              Simpan Produk
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Panggil file JS untuk handle submit form (opsional/nanti) -->
    <!-- <script src="tambah-produk-app.js"></script> -->
    <script src="produk-tambah.js"></script>
  </body>
</html>
