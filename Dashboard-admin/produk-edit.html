<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' 'unsafe-eval' http: https: data: blob:; connect-src 'self' http://localhost:3000 ws://localhost:3000 http: https:;"
    />
    <title>Edit Produk - Toko Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 min-h-screen">
    <div class="max-w-4xl mx-auto p-4 sm:p-6">
      <div class="mb-6">
        <a
          href="produk-admin.html"
          class="text-blue-600 hover:underline text-sm"
          >&larr; Kembali ke daftar produk</a
        >
        <h1 class="text-2xl font-bold text-gray-800 mt-3">Edit Produk</h1>
        <p class="text-gray-500 mt-1">Ubah informasi produk Toko Online.</p>
      </div>

      <div class="bg-white rounded-xl shadow p-6">
        <div
          id="pesan"
          class="hidden mb-4 rounded-lg p-3"
          role="status"
          aria-live="polite"
        ></div>

        <form id="form-edit-produk">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div class="md:col-span-2">
              <label
                for="nama-produk"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Nama Produk</label
              >
              <input
                type="text"
                id="nama-produk"
                required
                maxlength="200"
                class="w-full border border-gray-300 rounded-lg px-4 py-2.5"
              />
            </div>

            <div>
              <label
                for="kategori-produk"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Kategori</label
              >
              <select
                id="kategori-produk"
                required
                class="w-full border border-gray-300 rounded-lg px-4 py-2.5"
              >
                <option value="">Memuat kategori...</option>
              </select>
            </div>

            <div>
              <label
                for="harga-produk"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Harga (Rp)</label
              >
              <input
                type="number"
                id="harga-produk"
                min="0"
                step="1"
                required
                class="w-full border border-gray-300 rounded-lg px-4 py-2.5"
              />
            </div>

            <div>
              <label
                for="stok-produk"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Stok</label
              >
              <input
                type="number"
                id="stok-produk"
                min="0"
                step="1"
                required
                class="w-full border border-gray-300 rounded-lg px-4 py-2.5"
              />
            </div>

            <div>
              <label
                for="gambar-produk"
                class="block text-sm font-medium text-gray-700 mb-2"
                >URL Gambar</label
              >
              <input
                type="url"
                id="gambar-produk"
                required
                class="w-full border border-gray-300 rounded-lg px-4 py-2.5"
              />
            </div>

            <div>
              <label
                for="rating-produk"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Rating (0–5)</label
              >
              <input
                type="number"
                id="rating-produk"
                min="0"
                max="5"
                step="0.1"
                required
                class="w-full border border-gray-300 rounded-lg px-4 py-2.5"
              />
            </div>

            <div class="md:col-span-2">
              <label
                for="deskripsi-produk"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Deskripsi Produk</label
              >
              <textarea
                id="deskripsi-produk"
                rows="4"
                class="w-full border border-gray-300 rounded-lg px-4 py-2.5"
              ></textarea>
            </div>
          </div>

          <div class="flex justify-end gap-3 mt-8 pt-5 border-t">
            <a
              href="produk-admin.html"
              class="px-5 py-2.5 rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300"
              >Batal</a
            >
            <button
              type="submit"
              id="tombol-simpan"
              class="px-5 py-2.5 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700"
            >
              Simpan Perubahan
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="produk-edit.js"></script>
  </body>
</html>
